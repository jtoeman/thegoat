name: deploy-site

# Deploys the GOAT Worker (static site + routing) to Cloudflare on every push to main
# that touches the site, and can be run by hand from the Actions tab.

on:
  push:
    branches: [main]
    paths: ["index.html", "assets/**", "worker.js", "wrangler.jsonc", ".assetsignore"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy Worker thegoat
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
