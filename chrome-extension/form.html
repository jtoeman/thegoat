<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Add to GOAT</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font:14px system-ui,sans-serif;margin:16px;color:#111;background:#fff}
img#preview{max-width:100%;max-height:200px;display:block;margin:0 auto 10px;border:1px solid #ddd}
label{display:block;margin:10px 0 3px;font-weight:600}
input,select{width:100%;padding:7px;font:inherit;box-sizing:border-box}
button{margin-top:14px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
#submit{background:#ffd23f;border:2px solid #000;width:100%}
#msg{margin-top:10px;min-height:20px;white-space:pre-wrap}
.ok{color:#17703a}.err{color:#b3121c}
.hint{font-size:12px;color:#666;margin-top:3px}
#versus{position:relative; height:220px; margin:10px 0; border:3px solid #000; border-radius:10px; overflow:hidden; background:radial-gradient(ellipse at 50% 35%, #1d2752 0%, #0b1024 55%, #05070f 100%)}
#versus .fighter{position:absolute; top:0; bottom:0; width:60%; overflow:hidden}
#versus .fighter[data-side="a"]{left:0}
#versus .fighter[data-side="b"]{right:0}
#versus .portrait{position:absolute; inset:0; overflow:hidden; background:#111}
#versus .fighter[data-side="a"] .portrait{clip-path:polygon(0 0, 95% 0, 71.7% 100%, 0 100%)}
#versus .fighter[data-side="b"] .portrait{clip-path:polygon(31.7% 0, 100% 0, 100% 100%, 8.3% 100%)}
#versus .portrait img{width:100%; height:100%; object-fit:cover; display:block}
#versus .portrait::after{content:""; position:absolute; left:0; right:0; bottom:0; height:45%; background:linear-gradient(180deg, rgba(7,10,20,0), rgba(7,10,20,.88) 60%)}
#versus .label{position:absolute; left:0; right:0; bottom:0; padding:28px 6px 12px; display:flex; flex-direction:column; align-items:center; z-index:2}
#versus .fighter[data-side="a"] .label{padding-right:16.67%}
#versus .fighter[data-side="b"] .label{padding-left:16.67%}
#versus .plate{transform:skewX(-12deg); background:#fff; color:#0b0b0b; border:3px solid #000; box-shadow:3px 3px 0 #000; padding:3px 9px; font-family:Impact,"Haettenschweiler","Arial Narrow Bold",sans-serif; text-transform:uppercase; font-size:15px; letter-spacing:.03em; line-height:1.15; text-align:center; max-width:100%; min-height:26px}
#versus .plate span{display:block; transform:skewX(12deg); overflow-wrap:anywhere}
#versus .caps{position:absolute; top:6px; left:8px; right:8px; display:flex; justify-content:space-between; font:700 11px system-ui,sans-serif; color:#fff; text-shadow:0 1px 2px #000; z-index:3; pointer-events:none}
#conflict button{width:100%}#conflict button+button{margin-top:8px}#conflict[hidden]{display:none}
.foot{margin-top:14px;font-size:11px;color:#888}
</style></head><body>
<img id="preview" alt="">
<label for="category">Category</label>
<select id="category"></select>
<label for="name">Name</label>
<input id="name" placeholder="e.g. Golden Retriever" autocomplete="off">
<label for="license">License</label>
<select id="license">
  <option value="">Own asset (default)</option>
  <option>CC0</option><option>CC BY 4.0</option><option>CC BY-SA 4.0</option>
  <option>Public domain</option><option>Licensed (stock)</option><option>Own work</option>
</select>
<label for="author">Author / credit</label>
<input id="author" placeholder="Leave blank if it's your own" autocomplete="off">
<label for="source_page">Source page</label>
<input id="source_page" autocomplete="off">
<section id="conflict" hidden>
  <p id="conflictText"></p>
  <div id="versus">
    <div class="caps"><span>Current</span><span>New</span></div>
    <section class="fighter" data-side="a"><div class="portrait"><img id="cur" alt=""></div><div class="label"><div class="plate"><span id="curPlate"></span></div></div></section>
    <section class="fighter" data-side="b"><div class="portrait"><img id="incoming" alt=""></div><div class="label"><div class="plate"><span id="newPlate"></span></div></div></section>
  </div>
  <p class="hint" id="conflictInfo"></p>
  <button id="replace" type="button">Replace current</button>
  <button id="newName" type="button">Save as a new name</button>
  <button id="keep" type="button">Keep current, cancel</button>
</section>
<button id="submit">Add to GOAT</button>
<div id="msg"></div>
<div class="foot" id="foot">EXT5 · v0.5.0</div>
<script src="form.js"></script>
</body></html>
